<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="htmx-config" content='{"includeIndicatorStyles":false,"allowEval":false,"allowScriptTags":false}'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Knowledge Assistant</title>
    <link rel="stylesheet" href="{{ request.url_for('static', path='style.css') }}">
    <script src="{{ request.url_for('static', path='htmx.min.js') }}" defer></script>
    <script src="{{ request.url_for('static', path='ui.js') }}" defer></script>
</head>
<body>
    <main>
        <h1>Knowledge Assistant</h1>
        <p>Ask a question about the available documents.</p>

        <form method="post" action="{{ request.url_for('ask_ui') }}"
              hx-post="{{ request.url_for('ask_ui') }}"
              hx-target="#result"
              hx-indicator="#loading">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

            <label for="question">Your question</label>
            <textarea id="question" name="question"
                      required maxlength="2000" rows="5"></textarea>

            <button type="submit">Ask question</button>
            <p id="loading" class="htmx-indicator" role="status">
                Finding your answer...
            </p>
        </form>

        <section id="result" aria-live="polite" aria-atomic="true"></section>
    </main>
</body>
</html>
